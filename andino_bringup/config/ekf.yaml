# robot_localization EKF for one Andino: wheel odometry + the BNO055's heading -> odom -> base_link.
# Wildcard node key so that it configures the filter in any namespace (/<robot>/ekf_filter_node).
#
# Each *_config row is   x  y  z | roll pitch yaw | vx vy vz | vroll vpitch vyaw | ax ay az
/**/ekf_filter_node:
  ros__parameters:
    frequency: 30.0  # the rate of both inputs (the controller manager's update_rate)
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    print_diagnostics: false

    # Frames carry no robot prefix; the TF TOPIC is per-robot (remapped to /<robot>/tf).
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Wheel odometry: velocities only. Its pose is just those velocities integrated once already;
    # fusing both would count the same information twice. vy is fused as the zero it is — a
    # differential drive cannot slide sideways — which keeps the filter from inventing drift.
    #
    # The wheels' YAW RATE is NOT fused (owner's call, 2026-09-21): heading comes from the IMU alone.
    # Measured on a 106 m drive before the change: the fused heading already WAS the IMU's (never
    # more than 4.6 degrees apart in a turn, 0.00 at the end; position closure 0.83 m with wheel yaw
    # fused, 0.84 m without) — the wheels over-read turning by 4% (scrub) and the filter rightly
    # ignored them. What this gives up: a fallback if the IMU stops answering; the heading then
    # FREEZES while the robot turns. `base` logs "Discarding a malformed reply" if that happens.
    odom0: odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # IMU: the sensor's own fused HEADING, not the gyro rate — one or the other, never both: they
    # are the same gyroscope, and a filter told they are independent becomes overconfident.
    # Why the heading: the firmware runs the BNO055 in IMUPLUS (no magnetometer, so nothing indoors
    # can drag it), and measured on the robot against a full 360 degree turn back onto a tape line,
    # the chip's heading read 357.0 while the rate we sample at 30 Hz integrated to 366.4 — the
    # same ~3% gap showed in two quarter turns. At rest, lidar spinning, the chip holds +/-0.1
    # degrees where the integrated rate creeps; and a dropped serial sample costs the heading
    # nothing, where it costs the rate whatever the robot turned in that interval.
    # `relative`: the first reading becomes zero, so the robot's heading at start-up defines the
    # odom frame (IMUPLUS heading is relative to power-on anyway).
    imu0: imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    imu0_queue_size: 10
    imu0_differential: false
    imu0_relative: true
    imu0_remove_gravitational_acceleration: false
